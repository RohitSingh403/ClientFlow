name: Overdue invoices

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Mark overdue invoices
        run: |
          curl -fsS -X POST "https://clientflow-77i7.onrender.com/api/jobs/overdue" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
